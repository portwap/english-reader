# Processes one text: voices it with Kokoro, translates it with OpenRouter, saves the result to Netlify Blobs.
# Started by hand with a title and a text. On pull requests it does a dry run on the sample text instead.

name: process-text

on:
  workflow_dispatch:
    inputs:
      title:
        description: Title of the text
        required: true
        type: string
      text:
        # The form on GitHub is one line; `gh workflow run process-text -f text="$(cat file.txt)"` keeps paragraphs.
        description: English text
        required: true
        type: string
  pull_request:
    paths:
      - 'pipeline/**'
      - 'shared/**'
      - 'package-lock.json'
      - '.github/workflows/process-text.yml'

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TTS_VOICE: ${{ vars.TTS_VOICE }}
      TRANSLATION_MODELS: ${{ vars.TRANSLATION_MODELS }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@v7
        with:
          # kokoro 0.9.4 supports Python 3.10–3.12.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/python/requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # Only runtime packages: the pipeline runs .ts files directly on Node, no build step.
      - name: Install Node packages
        run: npm ci --omit=dev

      # --no-deps installs exactly the pinned set; pip check fails if anything is missing.
      - name: Install Python packages
        run: |
          pip install --no-deps -r pipeline/python/requirements.txt
          pip check

      # The model and voices (about 330 MB) come from Hugging Face; the cache saves downloading them every run.
      - name: Cache Kokoro model
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-v1_0

      # Inputs go through environment variables, never straight into the script, so no text can run as a command.
      - name: Process the text
        if: github.event_name == 'workflow_dispatch'
        env:
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          TITLE: ${{ inputs.title }}
          TEXT: ${{ inputs.text }}
        run: |
          printf '%s' "$TEXT" > "$RUNNER_TEMP/text.txt"
          node pipeline/process.ts --title "$TITLE" --text-file "$RUNNER_TEMP/text.txt"

      - name: Dry run on the sample text
        if: github.event_name == 'pull_request'
        run: node pipeline/process.ts --title "Sample" --text-file pipeline/samples/sample.txt --dry-run out/dry-run

      - name: Upload the dry run result
        if: github.event_name == 'pull_request' && always()
        uses: actions/upload-artifact@v7
        with:
          name: dry-run
          path: out/dry-run
          retention-days: 14
          if-no-files-found: ignore
