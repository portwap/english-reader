# Processes one text that the admin saved in Netlify Blobs: voices it, translates it, saves the result there.
# Started by the admin API with the text id. On pull requests it does a dry run on the sample text instead.

name: process-text

on:
  workflow_dispatch:
    inputs:
      id:
        description: Text id (the text, title and voice are read from storage)
        required: true
        type: string
  pull_request:
    paths:
      - 'pipeline/**'
      - 'shared/**'
      - 'package-lock.json'
      - '.github/workflows/process-text.yml'

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-24.04
    # A run takes 2–3 minutes; a stuck run is stopped long before the admin page offers "Retry" (20 minutes).
    timeout-minutes: 15
    env:
      TRANSLATOR: ${{ vars.TRANSLATOR }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TRANSLATION_MODELS: ${{ vars.TRANSLATION_MODELS }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@v7
        with:
          # kokoro 0.9.4 supports Python 3.10–3.12.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/python/requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # Only runtime packages: the pipeline runs .ts files directly on Node, no build step.
      - name: Install Node packages
        run: npm ci --omit=dev

      # --no-deps installs exactly the pinned set; pip check fails if anything is missing.
      - name: Install Python packages
        run: |
          pip install --no-deps -r pipeline/python/requirements.txt
          pip check

      # The model and voices (about 330 MB) come from Hugging Face; the cache saves downloading them every run.
      - name: Cache Kokoro model
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-v1_0

      # The id goes through an environment variable, never straight into the script, so it cannot run as a command.
      # The step's own time limit makes it fail (not cancel), so the next step still runs.
      - name: Process the text
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 12
        env:
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          TEXT_ID: ${{ inputs.id }}
        run: node pipeline/process.ts --id "$TEXT_ID"

      # If anything above failed or the run was cancelled, the text must not stay "processing" forever.
      - name: Mark the text as failed if the run stopped
        if: github.event_name == 'workflow_dispatch' && (failure() || cancelled())
        env:
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          TEXT_ID: ${{ inputs.id }}
        run: node pipeline/mark-failed.ts --id "$TEXT_ID"

      - name: Dry run on the sample text
        if: github.event_name == 'pull_request'
        run: node pipeline/process.ts --dry-run out/dry-run --title "Sample" --text-file pipeline/samples/sample.txt

      - name: Upload the dry run result
        if: github.event_name == 'pull_request' && always()
        uses: actions/upload-artifact@v7
        with:
          name: dry-run
          path: out/dry-run
          retention-days: 14
          if-no-files-found: ignore
