# Voice check (temporary, stage 1): voices a sample with every English Kokoro voice
# and uploads a listening page. Removed once a voice is chosen.

name: voice-check

on:
  workflow_dispatch:
  # Also runs on pull requests that touch the pipeline, so the page is ready to download from the PR.
  pull_request:
    paths:
      - 'pipeline/**'
      - '.github/workflows/voice-check.yml'

permissions:
  contents: read

jobs:
  voices:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: actions/setup-python@v7
        with:
          # kokoro 0.9.4 supports Python 3.10–3.12.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/python/requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # --no-deps installs exactly the pinned set; pip check fails if anything is missing.
      - name: Install Python packages
        run: |
          pip install --no-deps -r pipeline/python/requirements.txt
          pip check

      # The model and voices (about 330 MB) come from Hugging Face; the cache saves downloading them every run.
      - name: Cache Kokoro model
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-v1_0

      - name: Voice the sample with every voice
        run: node pipeline/voice-check/run.ts out/voice-check

      - uses: actions/upload-artifact@v7
        with:
          name: voice-check
          path: out/voice-check
          retention-days: 14
