# Netlify settings: Vite builds the pages into web/dist; functions in netlify/functions serve the API.

[build]
  command = "npm run build"
  publish = "web/dist"

# Every text page address is served by the one text page, which reads the id from the address.
[[redirects]]
  from = "/texts/*"
  to = "/text.html"
  status = 200

# Admin pages; keep in step with ROUTES in vite.config.ts. The edit rule comes before the text rule.
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin/login"
  to = "/admin/login.html"
  status = 200

[[redirects]]
  from = "/admin/forgot"
  to = "/admin/forgot.html"
  status = 200

[[redirects]]
  from = "/admin/password"
  to = "/admin/password.html"
  status = 200

[[redirects]]
  from = "/admin/new"
  to = "/admin/form.html"
  status = 200

[[redirects]]
  from = "/admin/texts/:id/edit"
  to = "/admin/form.html"
  status = 200

[[redirects]]
  from = "/admin/texts/:id"
  to = "/admin/text.html"
  status = 200

# Security headers for every page and API answer:
# - scripts, styles, requests and audio only from this site, so a script injected into a page cannot run;
# - the site cannot be shown inside another site's frame (clickjacking);
# - browsers must not guess file types, and other sites do not get our addresses as referrer.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; media-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
