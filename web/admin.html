<!doctype html>
<!-- Admin page: login, setting a password from the invite, the form to add or edit a text, the list of all texts.
     Filled by src/admin.ts; the data comes from the admin API, which checks the login itself. -->
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Админка · English Reader</title>
  </head>
  <body>
    <main class="page admin">
      <a class="back" href="/"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Все тексты</a>
      <h1>Админка</h1>
      <p id="status" class="status">Загружаю…</p>

      <form id="password-form" class="card" hidden>
        <h2>Задайте пароль</h2>
        <label>Пароль (не короче 12 символов)
          <input id="new-password" type="password" autocomplete="new-password" minlength="12" required>
        </label>
        <label>Пароль ещё раз
          <input id="new-password-again" type="password" autocomplete="new-password" minlength="12" required>
        </label>
        <button type="submit" class="primary">Сохранить пароль</button>
        <p id="password-message" class="message" role="alert"></p>
      </form>

      <form id="login-form" class="card" hidden>
        <h2>Вход</h2>
        <label>Почта
          <input id="email" type="email" autocomplete="username" required>
        </label>
        <label>Пароль
          <input id="password" type="password" autocomplete="current-password" required>
        </label>
        <button type="submit" class="primary">Войти</button>
        <p id="login-message" class="message" role="alert"></p>
      </form>

      <section id="panel" hidden>
        <p class="panel-top"><button id="logout" type="button" class="link">Выйти</button></p>
        <form id="text-form" class="card">
          <h2 id="form-heading">Новый текст</h2>
          <label>Название
            <input id="title" maxlength="200" required>
          </label>
          <label>Текст на английском
            <textarea id="text" rows="10" required></textarea>
          </label>
          <p id="counter" class="counter"></p>
          <label>Голос
            <select id="voice"></select>
          </label>
          <div class="form-buttons">
            <button id="save" type="submit" class="primary">Создать</button>
            <button id="cancel" type="button" hidden>Отмена</button>
          </div>
          <p id="form-message" class="message" role="status"></p>
        </form>
        <h2>Тексты</h2>
        <ul id="list" class="admin-list"></ul>
      </section>
    </main>
    <script type="module" src="/src/admin.ts"></script>
  </body>
</html>
