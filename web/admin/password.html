<!doctype html>
<!-- Admin: setting a password from an invite or reset email link, or changing it when logged in. Filled by src/admin/password.ts. -->
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Пароль · English Reader</title>
  </head>
  <body>
    <main class="page admin">
      <header class="admin-header"><p class="admin-brand">Админка</p><div class="admin-nav-side"><a href="/">На сайт</a></div></header>
      <p id="loading" class="status">Загружаю…</p>
      <form id="content" class="card" hidden>
        <h1 id="heading">Задайте пароль</h1>
        <label>Пароль (не короче 12 символов)
          <input id="new-password" type="password" autocomplete="new-password" minlength="12" required>
        </label>
        <label>Пароль ещё раз
          <input id="new-password-again" type="password" autocomplete="new-password" minlength="12" required>
        </label>
        <button id="submit" type="submit" class="primary">Сохранить пароль</button>
        <p id="message" class="message" role="alert"></p>
      </form>
    </main>
    <script type="module" src="/src/admin/password.ts"></script>
  </body>
</html>
